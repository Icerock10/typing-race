services:
  app:
    build:
      context: .
      dockerfile: backend/deployment/DockerFile
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
