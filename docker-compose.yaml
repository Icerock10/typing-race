services:
  app:
    environment:
      - CHOKIDAR_USEPOLLING=true # enabling live updates
    container_name: fastify-api
    build:
      context: .
      dockerfile: backend/deployment/DockerFile.dev
    ports:
      - "3001:3001"
    env_file: ./backend/.env
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
